<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 Romantic Garden 🌸</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background -->
    <div class="background-gradient"></div>

    <!-- Floating Sparkles -->
    <div id="sparkles"></div>

    <!-- Fireflies -->
    <div id="fireflies"></div>

    <!-- Floating Hearts -->
    <div id="hearts"></div>

    <!-- Music Button -->
    <button id="musicBtn" title="Play Music">
        🎵
    </button>

    <!-- Hidden Music -->
    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- Main Card -->
    <main class="card">

        <h1 class="title">
            Happy Girlfriend's Day ❤️
        </h1>

        <div id="typingText" class="message"></div>

        <button id="surpriseBtn">
            Surprise ❤️
        </button>

    </main>

    <!-- Garden -->
    <section class="garden">

        <div class="flower" data-color="yellow">
            <div class="stem"></div>
            <div class="leaf left"></div>
            <div class="leaf right"></div>
            <div class="bloom"></div>
        </div>

        <div class="flower" data-color="pink">
            <div class="stem"></div>
            <div class="leaf left"></div>
            <div class="leaf right"></div>
            <div class="bloom"></div>
        </div>

        <div class="flower" data-color="purple">
            <div class="stem"></div>
            <div class="leaf left"></div>
            <div class="leaf right"></div>
            <div class="bloom"></div>
        </div>

        <div class="flower" data-color="yellow">
            <div class="stem"></div>
            <div class="leaf left"></div>
            <div class="leaf right"></div>
            <div class="bloom"></div>
        </div>

        <div class="flower" data-color="pink">
            <div class="stem"></div>
            <div class="leaf left"></div>
            <div class="leaf right"></div>
            <div class="bloom"></div>
        </div>

        <div class="flower" data-color="purple">
            <div class="stem"></div>
            <div class="leaf left"></div>
            <div class="leaf right"></div>
            <div class="bloom"></div>
        </div>

    </section>

    <!-- Confetti Canvas -->
    <canvas id="confetti"></canvas>

    <!-- Footer -->
    <footer>
        Made with ❤️ just for you.
    </footer>

    <script src="script.js"></script>

</body>
</html>
